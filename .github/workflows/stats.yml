name: Update GitHub Stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate light card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&locale=kr&include_all_commits=true&disable_animations=true&card_width=460&text_color=374151&icon_color=4B8063&ring_color=83B99A&bg_color=FFFFFF&border_color=D8E1DB&border_radius=6
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate dark card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&locale=kr&include_all_commits=true&disable_animations=true&card_width=460&text_color=CBD5E1&icon_color=83B99A&ring_color=83B99A&bg_color=0D1117&border_color=30363D&border_radius=6
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-light.svg profile/stats-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update public GitHub Stats cards"
          git push
